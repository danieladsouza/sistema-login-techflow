<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>TechFlow Solutions - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>TechFlow Solutions</h1>

    <div class="card">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="text" id="loginName" placeholder="Usuário" required>
        <input type="password" id="loginPassword" placeholder="Senha" required>
        <button type="submit">Entrar</button>
      </form>
      <p id="loginMensagem" class="mensagem"></p>
    </div>

    <div class="card">
      <h2>Cadastro</h2>
      <form id="cadastroForm">
        <input type="text" id="cadastroName" placeholder="Usuário" required>
        <input type="password" id="cadastroPassword" placeholder="Senha" required>
        <button type="submit">Cadastrar</button>
      </form>
      <p id="cadastroMensagem" class="mensagem"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
